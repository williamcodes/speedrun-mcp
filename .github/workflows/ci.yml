name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: {} # reused by the release pipeline (publish.yml)

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy
      - name: Test (offline)
        # The `network` tests hit the live speedrun.com API; skip them in CI to
        # keep runs deterministic and avoid the 100 req/min rate limit.
        run: pytest -m "not network" -q

  bundle:
    # The Claude Desktop extension: validate the manifest and make sure the
    # bundle packs (the release workflow attaches it to each release).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - run: npx -y @anthropic-ai/mcpb@latest validate manifest.json
      - run: npx -y @anthropic-ai/mcpb@latest pack . speedrun-mcp.mcpb
