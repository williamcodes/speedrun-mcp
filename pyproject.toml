[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speedrun-mcp"
version = "0.3.3"
description = "Model Context Protocol server for the speedrun.com API — games, leaderboards, world records, players, personal bests, and (with an API key) run submission and moderation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William Jeffries" }]
keywords = ["mcp", "model-context-protocol", "speedrun", "speedrun.com", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Games/Entertainment",
]
dependencies = [
    # 1.6 introduced ToolAnnotations; this server uses the v1 FastMCP API.
    # SDK v2 changes imports and model fields, so it needs a separate migration.
    "mcp>=1.6.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.15.18", "mypy>=1.8", "pre-commit>=3.5"]

[project.urls]
Homepage = "https://github.com/williamcodes/speedrun-mcp"
Issues = "https://github.com/williamcodes/speedrun-mcp/issues"
"speedrun.com API" = "https://github.com/speedruncomorg/api"

[project.scripts]
speedrun-mcp = "speedrun_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: tests that hit the live speedrun.com API"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Keep this version, the dev dependency, and .pre-commit-config.yaml in sync.
required-version = "==0.15.18"

[tool.ruff.lint]
select = [
    "A",     # builtin shadowing
    "ASYNC", # blocking calls and other async mistakes
    "B",     # common bugs (flake8-bugbear)
    "C4",    # unnecessary collection construction
    "C90",   # function complexity
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # import sorting
    "PIE",   # redundant code
    "PLE",   # Pylint errors
    "PT",    # pytest practices
    "RET",   # return statements
    "RUF",   # Ruff-specific checks, including unused noqa directives
    "S",     # security checks (flake8-bandit)
    "SIM",   # simplification
    "T10",   # debugger statements
    "T20",   # print statements (stdout carries the MCP protocol)
    "UP",    # syntax compatible with the minimum Python version
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest uses assert statements

[tool.mypy]
python_version = "3.10"
files = ["src"]
# httpx/mcp/pydantic ship types; ignore any third-party without stubs.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
